[project]
name = "music-stem-lab"
version = "0.1.0"
description = "Private music job coordinator with a replaceable remote worker boundary"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "yt-dlp>=2025.1", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
